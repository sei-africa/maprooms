title: 
    en: Risk Monitoring
    fr: Suivi des Risques
description: 
    en: |
        <p>
        This Maproom enables users to track and assess current climate conditions at dekadal (10-day), monthly, and seasonal timescales. 
        </p>
        <p>
        Using a range of interactive maps and graphs the Maproom compares current rainfall against long-term climatological averages as well as recent years, helping users identify emerging anomalies and trends.
        </p>
        <p>
        By placing current conditions within their historical context, the Maproom helps users better understand the progression of the season and respond proactively to developing climate risks and opportunities.
        </p>
    fr: |
        <p>
        Cette Maproom permet aux utilisateurs de suivre et d’évaluer les conditions climatiques actuelles à des échelles temporelles décadaires (10 jours), mensuelles et saisonnières.
        </p>
        <p>
        Grâce à un ensemble de cartes et de graphiques interactifs, elle permet de comparer les précipitations actuelles aux moyennes climatologiques à long terme ainsi qu’à celles des années récentes, aidant ainsi les utilisateurs à détecter les anomalies et les tendances émergentes.
        </p>
        <p>
        En replaçant les conditions actuelles dans leur contexte historique, la Maproom aide les utilisateurs à mieux comprendre le déroulement de la saison et à réagir de manière proactive aux risques et aux opportunités climatiques qui se développent.
        </p>
type: navigation-page
# icon_function defined in /app/climate/monitoring/scripts/icons.py
icon_function: icon_climate_monitoring
# icon_image: default-emi_risk_monitoring.gif

## - dekadal: name of the html file under templates (ex: dekadal.html)
## and name of the yaml file under the folder yaml (ex: dekadal.html)
maprooms:
    - dek_rainfall:
        title:
            en: Dekadal Rainfall Monitoring
            fr: Suivi des Precipitations Décadaire
        description:
            en: This page displays dekadal (approximately 10-day) rainfall amounts over the country. The default map shows rainfall totals for the most recently available dekad, but totals for previous dekads can be displayed as well.
            fr: Cette page présente les cumuls de précipitations décadaires (approximativement 10 jours) sur l'ensemble du pays. La carte par défaut présente le total de précipitations pour la décade la plus récente disponible, mais les décades précédentes peuvent également être visualisées.
        icon_image: default-emi_monitoring_dekad.gif
    - monthly_spi:
        title:
            en: Monthly SPI Monitoring
            fr: Suivi du SPI Mensuel
        description:
            en: The Standardized Precipitation Index is an indicator of extreme rainfall events, whether they are drought or excess rainfall.
            fr: Le SPI est un indicateur d'évènements extrêmes de précipitations, qu'il s'agisse de sécheresse ou de fortes pluies.
        icon_image: default-emi_monitoring_spi_month.gif
    - seasonal_spi:
        title:
            en: Seasonal SPI Monitoring
            fr: Suivi du SPI Saisonnier
        description:
            en: The Standardized Precipitation Index is an indicator of extreme rainfall events, whether they are drought or excess rainfall.
            fr: Le suivi du SPI saisonnier analyse les tendances des températures et précipitations sur trois mois, comparant les conditions à venir (chaud/froid, humide/sec) avec les normales climatiques.
        icon_image: default-emi_monitoring_spi_season.gif

