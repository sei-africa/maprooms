description:
    en: |
        <h4>ONDJ Precipitation Forecast</h4>
        <p>
        Ethiopia has a growing season from October to January. This Maproom shows October-January rainfall forecast made in September using a NextGen multi-model approach.
        </p>
        <p>NextGen is a systematic general approach for designing, implementing, producing and verifying objective climate forecasts. It involves the identification of decision-relevant variables by the stakeholders; the analysis of the physical mechanisms, sources of predictability and suitable candidate predictors (in models and observations) for those key relevant variables. In those cases when prediction skill is high enough, NextGen helps select the best dynamical models for the region of interest through a process-based evaluation, and automatizes the generation and verification of tailored multi-model, statistically calibrated predictions at seasonal and sub-seasonal timescales.
        </p>
        <p>The system takes advantage of the expertise of forecasters and local scientists at the country’s national meteorological service and universities, to maximize predictive skill and tailoring of the climate services generated by the process. Rather than focusing on probabilities of above normal, normal and below normal categories of total rainfall or mean temperature, NextGen also provides probabilities of exceeding (or not) particular thresholds of interest in the decision-making process, thus enabling users to forecast with the same system both mean and extreme values.
        </p>
        <p>
        The models employed in this forecast are from the suite of the North American Multi-Model Ensemble (NMME) and the predictand is rainfall from the Climate Hazards Group InfraRed Precipitation with Station Data (CHIRPS). The default map shows, for the latest forecast made, the median value of the seasonal rainfall total forecast in the season. Users can use the Field menu to express the forecast in different ways, as follows:
        </p>
        <ul>
            <li><strong>Rainfall</strong>: most likely seasonal total rainfall</li>
            <li><strong>Anomaly</strong>: deviation in mm of the most likely seasonal total rainfall from yearly average of the most likely seasonal total rainfall predicted by the hindcast (1982-2015)</li>
            <li><strong>Percent of Median</strong>: deviation in percentages of the most likely seasonal total rainfall from yearly median of the most likely seasonal total rainfall predicted by the hindcast (1982-2015)</li>
            <li><strong>Probability of non-/exceeding a Percentile</strong>: forecast probability of seasonal total rainfall to be below/above the historically observed (1982-2015) chosen percentile</li>
            <li><strong>Probability of non-/exceeding a Precipitation amount</strong>: forecast probability of seasonal total rainfall to be below/above the chosen rainfall amount</li>
        </ul>
        <p>
        The Layers button, showing when mousing over the map, will reveal in/active layers on the map.
        <p>Clicking on the map will reveal information about the location clicked, as well as the full forecast distribution at that given location, compared with the historical distribution. Cumulative full distribution of the forecast (red) together with the climatological distribution (blue and black) for the forecast in view on the map shows under <strong>Probability of Exceedance</strong>, as well as the full probability distribution under <strong>Probability Distribution</strong>.</p>
        </p>    
        
    fr: |
        <h4>Prévision des précipitations ONDJ</h4>
        <p>
        L’Éthiopie connaît une saison de croissance d’octobre à janvier. Ce Maproom présente les prévisions de précipitations d’octobre à janvier produites en septembre à l’aide d’une approche multi-modèles NextGen.
        </p>
        <p>NextGen est une approche générale et systématique pour la conception, la mise en œuvre, la production et la vérification de prévisions climatiques objectives. Elle comprend l’identification, par les parties prenantes, des variables pertinentes pour la prise de décision ; l’analyse des mécanismes physiques, des sources de prévisibilité et des prédicteurs potentiels appropriés (dans les modèles et les observations) pour ces variables clés. Lorsque la qualité prédictive est suffisamment élevée, NextGen permet de sélectionner les meilleurs modèles dynamiques pour la région d’intérêt à travers une évaluation fondée sur les processus, et automatise la génération et la vérification de prévisions multi-modèles adaptées et statistiquement calibrées aux échelles saisonnière et sous-saisonnière.
        </p>
        <p>Le système tire parti de l’expertise des prévisionnistes et des scientifiques locaux du service météorologique national du pays et des universités, afin de maximiser la qualité prédictive et l’adaptation des services climatiques générés par le processus. Plutôt que de se concentrer sur les probabilités des catégories au-dessus de la normale, normale et au-dessous de la normale pour les précipitations totales ou la température moyenne, NextGen fournit également les probabilités de dépassement ou de non-dépassement de seuils particuliers présentant un intérêt pour la prise de décision, permettant ainsi aux utilisateurs de prévoir avec le même système aussi bien les valeurs moyennes que les valeurs extrêmes.
        </p>
        <p>
        Les modèles utilisés dans cette prévision proviennent de l’ensemble North American Multi-Model Ensemble (NMME), et la variable prédite est constituée des précipitations issues du jeu de données Climate Hazards Group InfraRed Precipitation with Station Data (CHIRPS). Pour la prévision la plus récente, la carte par défaut affiche la valeur médiane du cumul saisonnier de précipitations prévu pour la saison. Les utilisateurs peuvent utiliser le menu Field pour exprimer la prévision de différentes manières, comme suit :
        </p>
        <ul>
            <li><strong>Précipitations</strong>: cumul saisonnier de précipitations le plus probable</li>
            <li><strong>Anomalie</strong>: écart en mm entre le cumul saisonnier de précipitations le plus probable et la moyenne annuelle du cumul saisonnier le plus probable prévu par les rétrospectives de prévision (1982-2015)</li>
            <li><strong>Pourcentage de la médiane</strong>: écart en pourcentage entre le cumul saisonnier de précipitations le plus probable et la médiane annuelle du cumul saisonnier le plus probable prévu par les rétrospectives de prévision (1982-2015)</li>
            <li><strong>Probabilité de non-dépassement/dépassement d’un percentile</strong>: probabilité prévue que le cumul saisonnier de précipitations soit inférieur/supérieur au percentile choisi, déterminé à partir des observations historiques (1982-2015)</li>
            <li><strong>Probabilité de non-dépassement/dépassement d’une quantité de précipitations</strong>: probabilité prévue que le cumul saisonnier de précipitations soit inférieur/supérieur à la quantité de précipitations choisie</li>
        </ul>
        <p>
        Le bouton Layers, qui apparaît lorsque le curseur de la souris survole la carte, permet d’afficher les couches actives/inactives sur la carte.
        <p>Un clic sur la carte affiche des informations sur l’emplacement sélectionné, ainsi que la distribution complète des prévisions pour cet emplacement, comparée à la distribution historique. La distribution cumulative complète de la prévision (rouge), accompagnée de la distribution climatologique (bleue et noire) correspondant à la prévision affichée sur la carte, est présentée sous <strong>Probabilité de dépassement</strong>, ainsi que la distribution complète des probabilités sous <strong>Distribution de probabilité</strong>.</p>
        </p>  

